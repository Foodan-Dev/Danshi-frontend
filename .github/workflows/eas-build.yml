name: EAS Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - android
          - ios
        default: all
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options:
          - preview
          - production
          - testflight
        default: preview

jobs:
  build:
    name: EAS Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Verify generated API contract
        run: npm run api:check

      - name: Resolve build params
        id: params
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          VERSION=$(jq -r '.expo.version' app.json)

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # 打 tag 即正式发版，默认出 testflight 包并自动提交；
            # 手动触发时才默认 preview，用于不进 TestFlight 的内测分发。
            PROFILE="${{ github.event.inputs.profile || 'testflight' }}"
            TAG="${{ github.ref_name }}"
          else
            PROFILE="${{ github.event.inputs.profile || 'preview' }}"
            TAG="v${VERSION}-${PROFILE}.${{ github.run_number }}"
          fi

          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: EAS Build
        run: |
          eas build \
            --platform ${{ steps.params.outputs.platform }} \
            --profile ${{ steps.params.outputs.profile }} \
            --non-interactive --wait

      # 只有 iOS 的 testflight / production 构建才提交 App Store Connect。
      # preview 是内测分发包，提交 TestFlight 没有意义。
      - name: Submit to TestFlight
        if: |
          (steps.params.outputs.platform == 'ios' || steps.params.outputs.platform == 'all') &&
          (steps.params.outputs.profile == 'testflight' || steps.params.outputs.profile == 'production')
        run: |
          set -euo pipefail
          # 用具体 build id 而不是 --latest：--latest 在并发构建时可能指向别人的构建。
          BUILD_ID=$(eas build:list --platform ios \
            --profile "${{ steps.params.outputs.profile }}" \
            --status finished --limit 1 --json --non-interactive \
            | jq -r '.[0].id // empty')
          if [ -z "$BUILD_ID" ]; then
            echo "找不到已完成的 iOS 构建，无法提交" >&2
            exit 1
          fi
          echo "提交 build $BUILD_ID 到 App Store Connect"
          # 提交失败必须让 workflow 失败：此前发生过 Apple 协议过期导致提交被拒，
          # 静默跳过会让人以为已经发出去了。
          eas submit --platform ios --id "$BUILD_ID" --non-interactive

      - name: Download artifacts
        run: |
          PLATFORM="${{ steps.params.outputs.platform }}"
          PROFILE="${{ steps.params.outputs.profile }}"
          VERSION="${{ steps.params.outputs.version }}"

          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "android" ]; then
            URL=$(eas build:list --platform android --profile "$PROFILE" \
              --status finished --limit 1 --json --non-interactive \
              | jq -r '.[0].artifacts.buildUrl')
            if [ "$URL" != "null" ] && [ -n "$URL" ]; then
              curl -L -o "DanShi-v${VERSION}-${PROFILE}.apk" "$URL"
              echo "Downloaded Android artifact"
            fi
          fi

          if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "ios" ]; then
            URL=$(eas build:list --platform ios --profile "$PROFILE" \
              --status finished --limit 1 --json --non-interactive \
              | jq -r '.[0].artifacts.buildUrl')
            if [ "$URL" != "null" ] && [ -n "$URL" ]; then
              curl -L -o "DanShi-v${VERSION}-${PROFILE}.ipa" "$URL"
              echo "Downloaded iOS artifact"
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag }}
          name: DanShi v${{ steps.params.outputs.version }} (${{ steps.params.outputs.profile }})
          files: |
            DanShi-*.apk
            DanShi-*.ipa
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
