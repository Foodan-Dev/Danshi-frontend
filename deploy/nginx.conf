server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Expo Router 导出的是多页静态文件，缺省回落到 index.html 保证前端路由可用
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # 带指纹的静态资源可以长缓存，HTML 不缓存以免版本卡住
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
